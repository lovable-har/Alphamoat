name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Wrap with Capacitor & Compile APK
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/browser@latest @capacitor/app@latest
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.alphamoat.screener",
            "appName": "AlphaMoat",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android && npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaMoat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
